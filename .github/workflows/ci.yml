name: CI

on:
  push:
    branches: [main, develop]
  # Both bases: a step's work arrives as feature -> develop, and develop -> main
  # is the release PR. Filtering to main alone left feature PRs unchecked.
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # check:lastmod reads Git history for the sitemap's page dates.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Terminology is a hard rule (CLAUDE.md): gold is described by purity and
      # where it is crafted, never by a country name as a purity claim.
      - run: npm run check:terms

      # Every user-facing string follows the language toggle: no CJK literal in
      # a .tsx outside lib/i18n and lib/content. Also runs check:layaway-ja:
      # nothing layaway-related renders on the Japanese site (2026-09-25).
      - run: npm run check:i18n

      # The two analytics invariants that decide whether an event reported from
      # a mount effect is recorded at all. Both were broken in production on
      # 2026-09-15 and nothing said so — the failure is silent by construction.
      - run: npm run check:analytics

      # Every customer-facing money figure comes from the Hub (owner rule
      # 2026-09-25): no percentage on a price, no currency conversion and no
      # hardcoded rate in app/, components/ or lib/ (fixtures excepted).
      - run: npm run check:money

      # Hero = the original tool's cut-outs only; product pages and cards =
      # Photoroom / normal photos only (owner rule 2026-09-28).
      - run: npm run check:cutouts

      # The sitemap's <lastmod> for /about and /jewelry-guide is the Git date of
      # their content file, committed in lib/page-lastmod.generated.ts. Editing
      # either file without regenerating fails here (SEO Step 1, Master Plan 33.3e).
      - run: npm run check:lastmod

      # H2 (Paidy QC 2026-10-09): the unit tests — Paidy flow, card, CSP,
      # order display, site time — were never run on a push; a regression
      # passed every other check unseen.
      - run: npm run test:unit

      - run: npm run typecheck

      - run: npm run lint
