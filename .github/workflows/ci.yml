name: CI

on:
  push:
    branches: [main, develop]
  # Both bases: a step's work arrives as feature -> develop, and develop -> main
  # is the release PR. Filtering to main alone left feature PRs unchecked.
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Terminology is a hard rule (CLAUDE.md): gold is described by purity and
      # where it is crafted, never by a country name as a purity claim.
      - run: npm run check:terms

      # Every user-facing string follows the language toggle: no CJK literal in
      # a .tsx outside lib/i18n and lib/content.
      - run: npm run check:i18n

      # The two analytics invariants that decide whether an event reported from
      # a mount effect is recorded at all. Both were broken in production on
      # 2026-09-15 and nothing said so — the failure is silent by construction.
      - run: npm run check:analytics

      # The FAQ is authoritative and much of it is terms. It is being converted
      # from LegalBlock[] into the markdown the Hub holds, and this renders every
      # answer BOTH ways and asserts the plain text is identical — a dropped
      # bullet or a swallowed link label must fail here rather than ship. It
      # also proves docs/faq-seed.sql still matches the content it came from;
      # that file is run once, by hand, so nothing else would catch a stale one.
      - run: npm run check:faq

      - run: npm run typecheck

      - run: npm run lint
